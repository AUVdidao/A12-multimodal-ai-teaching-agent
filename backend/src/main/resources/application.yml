server:
  port: 8080

spring:
  application:
    name: a12-teaching-agent-backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    url: jdbc:h2:file:./data/a12-teaching-agent
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO

app:
  storage:
    upload-dir: ${APP_UPLOAD_DIR:./data/uploads}
    max-file-size: ${APP_MAX_UPLOAD_SIZE:20971520}

a12:
  ai:
    provider: MOCK
    fallback-to-mock: true
    dify:
      base-url: https://api.dify.ai/v1
      workflow-id:
      api-key:
