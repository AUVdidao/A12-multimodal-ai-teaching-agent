server:
  port: 8080

spring:
  profiles:
    default: dev
  application:
    name: a12-teaching-agent-backend
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 205MB
  datasource:
    url: jdbc:h2:file:./data/a12-teaching-agent
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${A12_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    clean-disabled: true
    fail-on-missing-locations: true
    validate-on-migrate: true
    out-of-order: false

logging:
  level:
    root: INFO

app:
  storage:
    upload-dir: ${APP_UPLOAD_DIR:./data/uploads}
    max-file-size: ${APP_MAX_UPLOAD_SIZE:209715200}

a12:
  template:
    renderer:
      # Empty by default: no renderer is silently substituted. Set this only to an approved
      # local Office-compatible executable such as soffice in a controlled deployment.
      executable: ${A12_TEMPLATE_RENDERER_EXECUTABLE:}
      timeout-seconds: ${A12_TEMPLATE_RENDERER_TIMEOUT_SECONDS:120}
      output-dir: ${A12_TEMPLATE_RENDERER_OUTPUT_DIR:}
      # Disabled by default. This creates a synthetic PDF solely for local
      # development and is never a real Office/LibreOffice render.
      fixture-enabled: ${A12_TEMPLATE_RENDERER_FIXTURE_ENABLED:false}
    analyzer:
      # Disabled unless a reviewed multimodal provider and a reachable rendered
      # preview endpoint are explicitly configured in the deployment environment.
      enabled: ${A12_TEMPLATE_ANALYZER_ENABLED:false}
      # Development-only semantic Candidate fixture. It never runs outside the
      # dev profile and never replaces the real Provider path by default.
      fixture-enabled: ${A12_TEMPLATE_ANALYZER_FIXTURE_ENABLED:false}
      preview-base-url: ${A12_TEMPLATE_ANALYZER_PREVIEW_BASE_URL:}
      provider: ${A12_TEMPLATE_ANALYZER_PROVIDER:KIMI}
      model: ${A12_TEMPLATE_ANALYZER_MODEL:}
      max-completion-tokens: ${A12_TEMPLATE_ANALYZER_MAX_COMPLETION_TOKENS:1600}
      timeout-ms: ${A12_TEMPLATE_ANALYZER_TIMEOUT_MS:90000}
  lessonforge:
    model-execution:
      base-url: ${A12_MODEL_EXECUTION_BASE_URL:http://server:8090}
      bearer-token: ${A12_MODEL_EXECUTION_BEARER_TOKEN:${A12_INTERNAL_SERVICE_TOKEN:}}
      timeout-ms: ${A12_MODEL_EXECUTION_TIMEOUT_MS:120000}
  kimi:
    base-url: ${KIMI_API_BASE_URL:https://api.moonshot.cn/v1}
    api-key: ${MOONSHOT_API_KEY:}
    connect-timeout-seconds: ${KIMI_CONNECT_TIMEOUT_SECONDS:15}
    request-attempts: ${KIMI_REQUEST_ATTEMPTS:2}
    retry-delay-millis: ${KIMI_RETRY_DELAY_MILLIS:1200}
    assistant-model: ${KIMI_ASSISTANT_MODEL:kimi-k2.6}
    assistant-timeout-seconds: ${KIMI_ASSISTANT_TIMEOUT_SECONDS:90}
    assistant-max-completion-tokens: ${KIMI_ASSISTANT_MAX_COMPLETION_TOKENS:1600}
    workflow-model: ${KIMI_WORKFLOW_MODEL:kimi-k2.6}
    workflow-timeout-seconds: ${KIMI_WORKFLOW_TIMEOUT_SECONDS:180}
    workflow-max-completion-tokens: ${KIMI_WORKFLOW_MAX_COMPLETION_TOKENS:8000}
    workflow-max-input-characters: ${KIMI_WORKFLOW_MAX_INPUT_CHARACTERS:60000}
  credentials:
    encryption-key: ${A12_CREDENTIAL_ENCRYPTION_KEY:}
  artifact-generator:
    mode: ${A12_ARTIFACT_GENERATOR_MODE:local}
    base-url: ${A12_ARTIFACT_GENERATOR_BASE_URL:http://file-generator-service:8080}
    timeout-ms: ${A12_ARTIFACT_GENERATOR_TIMEOUT_MS:15000}
  ppt-engine:
    mode: ${A12_PPT_ENGINE_MODE:unavailable}
    base-url: ${A12_PPT_ENGINE_BASE_URL:http://ppt-engine-service:8080}
    timeout-ms: ${A12_PPT_ENGINE_TIMEOUT_MS:15000}
    trace-file: ${A12_PPT_ENGINE_TRACE_FILE:}
  material-parser:
    mode: ${A12_MATERIAL_PARSER_MODE:local}
    base-url: ${A12_MATERIAL_PARSER_BASE_URL:http://file-parser-service:8080}
    timeout-ms: ${A12_MATERIAL_PARSER_TIMEOUT_MS:120000}
    max-request-bytes: ${A12_MATERIAL_PARSER_MAX_REQUEST_BYTES:214958080}
    processing-stale-after-seconds: ${A12_MATERIAL_PARSER_PROCESSING_STALE_AFTER_SECONDS:300}
  security:
    enabled: ${A12_SECURITY_ENABLED:true}
    internal-service-token: ${A12_INTERNAL_SERVICE_TOKEN:}
    session-hours: ${A12_SESSION_HOURS:12}
    demo-seed-enabled: ${A12_DEMO_SEED_ENABLED:false}
    demo:
      leader-password: ${A12_DEMO_LEADER_PASSWORD:}
      teacher-password: ${A12_DEMO_TEACHER_PASSWORD:}
      student-password: ${A12_DEMO_STUDENT_PASSWORD:}
      multi-password: ${A12_DEMO_MULTI_PASSWORD:}
  ai:
    provider: ${A12_AI_PROVIDER:${AI_PROVIDER:KIMI}}
    fallback-to-mock: ${A12_AI_FALLBACK_TO_MOCK:false}
    development-mock-enabled: ${A12_AI_DEVELOPMENT_MOCK_ENABLED:false}
