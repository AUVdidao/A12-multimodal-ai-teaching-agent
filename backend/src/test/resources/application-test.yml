spring:
  datasource:
    url: jdbc:h2:mem:a12_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

a12:
  ai:
    provider: MOCK
    fallback-to-mock: true
    dify:
      base-url: https://api.dify.ai/v1
      workflow-id:
      api-key:
