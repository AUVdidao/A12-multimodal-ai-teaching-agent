server:
  port: 8080

spring:
  application:
    name: a12-teaching-agent-backend
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 205MB
  datasource:
    url: jdbc:h2:file:./data/a12-teaching-agent
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO

app:
  storage:
    upload-dir: ${APP_UPLOAD_DIR:./data/uploads}
    max-file-size: ${APP_MAX_UPLOAD_SIZE:209715200}

a12:
  ppt-skill:
    provider: ${PPT_GENERATOR_PROVIDER:LEGACY}
    generation-mode: ${PPT_GENERATION_MODE:LEGACY}
    harness-base-url: ${PPT_HARNESS_BASE_URL:http://127.0.0.1:18091}
    runner-base-url: ${PPT_SKILL_RUNNER_BASE_URL:http://127.0.0.1:18090}
    timeout-seconds: ${PPT_SKILL_TIMEOUT_SECONDS:600}
    poll-interval-millis: ${PPT_SKILL_POLL_INTERVAL_MILLIS:1000}
    storage-dir: ${PPT_SKILL_STORAGE_DIR:./data/generated/ppt}
    style-preset: ${PPT_SKILL_STYLE_PRESET:forest-research}
    outline-provider: ${PPT_OUTLINE_PROVIDER:FIXTURE}
    fixture-enabled: ${PPT_OUTLINE_FIXTURE_ENABLED:false}
    kimi-base-url: ${KIMI_API_BASE_URL:https://api.moonshot.ai/v1}
    kimi-api-key: ${MOONSHOT_API_KEY:}
    kimi-model: ${KIMI_PPT_MODEL:kimi-k2.6}
    kimi-timeout-seconds: ${KIMI_PPT_TIMEOUT_SECONDS:120}
    kimi-max-completion-tokens: ${KIMI_PPT_MAX_COMPLETION_TOKENS:6000}
  artifact-generator:
    mode: ${A12_ARTIFACT_GENERATOR_MODE:local}
    base-url: ${A12_ARTIFACT_GENERATOR_BASE_URL:http://file-generator-service:8080}
    timeout-ms: ${A12_ARTIFACT_GENERATOR_TIMEOUT_MS:15000}
  material-parser:
    mode: ${A12_MATERIAL_PARSER_MODE:local}
    base-url: ${A12_MATERIAL_PARSER_BASE_URL:http://file-parser-service:8080}
    timeout-ms: ${A12_MATERIAL_PARSER_TIMEOUT_MS:10000}
    max-request-bytes: ${A12_MATERIAL_PARSER_MAX_REQUEST_BYTES:20971520}
  security:
    enabled: ${A12_SECURITY_ENABLED:true}
    session-hours: ${A12_SESSION_HOURS:12}
    demo-seed-enabled: ${A12_DEMO_SEED_ENABLED:false}
    demo:
      leader-password: ${A12_DEMO_LEADER_PASSWORD:}
      teacher-password: ${A12_DEMO_TEACHER_PASSWORD:}
      student-password: ${A12_DEMO_STUDENT_PASSWORD:}
      multi-password: ${A12_DEMO_MULTI_PASSWORD:}
  ai:
    provider: ${A12_AI_PROVIDER:${AI_PROVIDER:MOCK}}
    fallback-to-mock: ${A12_AI_FALLBACK_TO_MOCK:true}
    dify:
      base-url: ${A12_AI_DIFY_BASE_URL:${DIFY_BASE_URL:https://api.dify.ai/v1}}
      user-prefix: ${A12_AI_DIFY_USER_PREFIX:a12-project-}
      connect-timeout: ${A12_AI_DIFY_CONNECT_TIMEOUT:5s}
      read-timeout: ${A12_AI_DIFY_READ_TIMEOUT:600s}
      workflows:
        clarification:
          workflow-id: ${DIFY_APP01_REQUIREMENT_WORKFLOW_ID:${DIFY_WF01_WORKFLOW_ID:}}
          api-key: ${DIFY_APP01_REQUIREMENT_API_KEY:${DIFY_WF01_API_KEY:}}
        summary:
          workflow-id: ${DIFY_APP01_REQUIREMENT_WORKFLOW_ID:${DIFY_WF02_WORKFLOW_ID:}}
          api-key: ${DIFY_APP01_REQUIREMENT_API_KEY:${DIFY_WF02_API_KEY:}}
        material:
          workflow-id: ${DIFY_APP02_MATERIAL_INTENT_WORKFLOW_ID:${DIFY_WF03_WORKFLOW_ID:}}
          api-key: ${DIFY_APP02_MATERIAL_INTENT_API_KEY:${DIFY_WF03_API_KEY:}}
        knowledge-intent:
          workflow-id: ${DIFY_APP02_MATERIAL_INTENT_WORKFLOW_ID:${DIFY_WF04_WORKFLOW_ID:}}
          api-key: ${DIFY_APP02_MATERIAL_INTENT_API_KEY:${DIFY_WF04_API_KEY:}}
        generation-plan:
          workflow-id: ${DIFY_APP03_GENERATION_PLAN_WORKFLOW_ID:${DIFY_WF05_WORKFLOW_ID:}}
          api-key: ${DIFY_APP03_GENERATION_PLAN_API_KEY:${DIFY_WF05_API_KEY:}}
        content-draft:
          workflow-id: ${DIFY_APP04_CONTENT_DRAFT_WORKFLOW_ID:${DIFY_WF06_WORKFLOW_ID:}}
          api-key: ${DIFY_APP04_CONTENT_DRAFT_API_KEY:${DIFY_WF06_API_KEY:}}
        revision:
          workflow-id: ${DIFY_APP05_REVISION_WORKFLOW_ID:${DIFY_WF07_WORKFLOW_ID:}}
          api-key: ${DIFY_APP05_REVISION_API_KEY:${DIFY_WF07_API_KEY:}}
