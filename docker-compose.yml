services:
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      DIFY_BASE_URL: ${DIFY_BASE_URL:-}
      A12_AI_PROVIDER: ${AI_PROVIDER:-mock}
      A12_AI_FALLBACK_TO_MOCK: "true"
      A12_AI_DIFY_BASE_URL: ${DIFY_BASE_URL:-https://api.dify.ai/v1}
      A12_AI_DIFY_CONNECT_TIMEOUT: ${A12_AI_DIFY_CONNECT_TIMEOUT:-5s}
      A12_AI_DIFY_READ_TIMEOUT: ${A12_AI_DIFY_READ_TIMEOUT:-600s}
      DIFY_APP01_REQUIREMENT_API_KEY: ${DIFY_APP01_REQUIREMENT_API_KEY:-}
      DIFY_APP02_MATERIAL_INTENT_API_KEY: ${DIFY_APP02_MATERIAL_INTENT_API_KEY:-}
      DIFY_APP03_GENERATION_PLAN_API_KEY: ${DIFY_APP03_GENERATION_PLAN_API_KEY:-}
      DIFY_APP04_CONTENT_DRAFT_API_KEY: ${DIFY_APP04_CONTENT_DRAFT_API_KEY:-}
      DIFY_APP05_REVISION_API_KEY: ${DIFY_APP05_REVISION_API_KEY:-}
      DIFY_APP01_REQUIREMENT_WORKFLOW_ID: ${DIFY_APP01_REQUIREMENT_WORKFLOW_ID:-}
      DIFY_APP02_MATERIAL_INTENT_WORKFLOW_ID: ${DIFY_APP02_MATERIAL_INTENT_WORKFLOW_ID:-}
      DIFY_APP03_GENERATION_PLAN_WORKFLOW_ID: ${DIFY_APP03_GENERATION_PLAN_WORKFLOW_ID:-}
      DIFY_APP04_CONTENT_DRAFT_WORKFLOW_ID: ${DIFY_APP04_CONTENT_DRAFT_WORKFLOW_ID:-}
      DIFY_APP05_REVISION_WORKFLOW_ID: ${DIFY_APP05_REVISION_WORKFLOW_ID:-}
      # Deprecated seven-slot variables remain pass-through compatible for existing local .env files.
      DIFY_WF01_API_KEY: ${DIFY_WF01_API_KEY:-}
      DIFY_WF02_API_KEY: ${DIFY_WF02_API_KEY:-}
      DIFY_WF03_API_KEY: ${DIFY_WF03_API_KEY:-}
      DIFY_WF04_API_KEY: ${DIFY_WF04_API_KEY:-}
      DIFY_WF05_API_KEY: ${DIFY_WF05_API_KEY:-}
      DIFY_WF06_API_KEY: ${DIFY_WF06_API_KEY:-}
      DIFY_WF07_API_KEY: ${DIFY_WF07_API_KEY:-}
      DIFY_WF01_WORKFLOW_ID: ${DIFY_WF01_WORKFLOW_ID:-}
      DIFY_WF02_WORKFLOW_ID: ${DIFY_WF02_WORKFLOW_ID:-}
      DIFY_WF03_WORKFLOW_ID: ${DIFY_WF03_WORKFLOW_ID:-}
      DIFY_WF04_WORKFLOW_ID: ${DIFY_WF04_WORKFLOW_ID:-}
      DIFY_WF05_WORKFLOW_ID: ${DIFY_WF05_WORKFLOW_ID:-}
      DIFY_WF06_WORKFLOW_ID: ${DIFY_WF06_WORKFLOW_ID:-}
      DIFY_WF07_WORKFLOW_ID: ${DIFY_WF07_WORKFLOW_ID:-}
      APP_UPLOAD_DIR: ${APP_UPLOAD_DIR:-/app/data/uploads}
      APP_MAX_UPLOAD_SIZE: ${APP_MAX_UPLOAD_SIZE:-209715200}
      A12_SECURITY_ENABLED: ${A12_SECURITY_ENABLED:-true}
      A12_SESSION_HOURS: ${A12_SESSION_HOURS:-12}
      A12_DEMO_SEED_ENABLED: ${A12_DEMO_SEED_ENABLED:-true}
      A12_DEMO_LEADER_PASSWORD: ${A12_DEMO_LEADER_PASSWORD:-Leader123!}
      A12_DEMO_TEACHER_PASSWORD: ${A12_DEMO_TEACHER_PASSWORD:-Teacher123!}
      A12_DEMO_STUDENT_PASSWORD: ${A12_DEMO_STUDENT_PASSWORD:-Student123!}
      A12_DEMO_MULTI_PASSWORD: ${A12_DEMO_MULTI_PASSWORD:-Multi123!}
      A12_MATERIAL_PARSER_MODE: ${A12_MATERIAL_PARSER_MODE:-remote}
      A12_MATERIAL_PARSER_BASE_URL: ${A12_MATERIAL_PARSER_BASE_URL:-http://file-parser-service:8080}
      A12_MATERIAL_PARSER_TIMEOUT_MS: ${A12_MATERIAL_PARSER_TIMEOUT_MS:-10000}
      A12_ARTIFACT_GENERATOR_MODE: ${A12_ARTIFACT_GENERATOR_MODE:-remote}
      A12_ARTIFACT_GENERATOR_BASE_URL: ${A12_ARTIFACT_GENERATOR_BASE_URL:-http://file-generator-service:8080}
      A12_ARTIFACT_GENERATOR_TIMEOUT_MS: ${A12_ARTIFACT_GENERATOR_TIMEOUT_MS:-15000}
      PPT_GENERATOR_PROVIDER: ${PPT_GENERATOR_PROVIDER:-LEGACY}
      PPT_GENERATION_MODE: ${PPT_GENERATION_MODE:-LEGACY}
      PPT_HARNESS_BASE_URL: ${PPT_HARNESS_BASE_URL:-http://ppt-harness:8091}
      PPT_SKILL_RUNNER_BASE_URL: ${PPT_SKILL_RUNNER_BASE_URL:-http://ppt-skill-runner:8090}
      PPT_SKILL_TIMEOUT_SECONDS: ${PPT_SKILL_TIMEOUT_SECONDS:-600}
      PPT_SKILL_POLL_INTERVAL_MILLIS: ${PPT_SKILL_POLL_INTERVAL_MILLIS:-1000}
      PPT_SKILL_STORAGE_DIR: ${PPT_SKILL_STORAGE_DIR:-/app/data/generated/ppt}
      PPT_SKILL_STYLE_PRESET: ${PPT_SKILL_STYLE_PRESET:-forest-research}
      PPT_OUTLINE_PROVIDER: ${PPT_OUTLINE_PROVIDER:-FIXTURE}
      PPT_OUTLINE_FIXTURE_ENABLED: ${PPT_OUTLINE_FIXTURE_ENABLED:-false}
      KIMI_API_BASE_URL: ${KIMI_API_BASE_URL:-https://api.moonshot.ai/v1}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      KIMI_PPT_MODEL: ${KIMI_PPT_MODEL:-kimi-k2.6}
      KIMI_PPT_TIMEOUT_SECONDS: ${KIMI_PPT_TIMEOUT_SECONDS:-120}
      KIMI_PPT_MAX_COMPLETION_TOKENS: ${KIMI_PPT_MAX_COMPLETION_TOKENS:-6000}
      KIMI_ASSISTANT_MODEL: ${KIMI_ASSISTANT_MODEL:-kimi-k2.6}
      KIMI_ASSISTANT_TIMEOUT_SECONDS: ${KIMI_ASSISTANT_TIMEOUT_SECONDS:-90}
      KIMI_ASSISTANT_MAX_COMPLETION_TOKENS: ${KIMI_ASSISTANT_MAX_COMPLETION_TOKENS:-1600}
    volumes:
      - backend-data:/app/data
    networks:
      - a12-local-net
    depends_on:
      file-parser-service:
        condition: service_healthy
      file-generator-service:
        condition: service_healthy
      ppt-skill-runner:
        condition: service_healthy
      ppt-harness:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  file-parser-service:
    build:
      context: ./file-parser-service
      dockerfile: Dockerfile
    networks:
      - a12-local-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/internal/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  file-generator-service:
    build:
      context: ./file-generator-service
      dockerfile: Dockerfile
    networks:
      - a12-local-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/internal/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  ppt-skill-runner:
    build:
      context: ./ppt-skill-runner
      dockerfile: Dockerfile
    networks:
      - a12-local-net
    ports:
      - "${PPT_SKILL_RUNNER_PORT:-18090}:8090"
    volumes:
      - ppt-skill-results:/app/data/results
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ppt-harness-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: a12_harness
      POSTGRES_USER: a12_harness
      POSTGRES_PASSWORD: ${PPT_HARNESS_POSTGRES_PASSWORD:-a12_harness_dev}
    volumes:
      - ppt-harness-postgres:/var/lib/postgresql/data
      - ./ppt-harness/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - a12-local-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a12_harness -d a12_harness"]
      interval: 10s
      timeout: 5s
      retries: 12

  ppt-harness:
    build:
      context: ./ppt-harness
      dockerfile: Dockerfile
    environment:
      PPT_HARNESS_DATABASE_URL: postgresql://a12_harness:${PPT_HARNESS_POSTGRES_PASSWORD:-a12_harness_dev}@ppt-harness-postgres:5432/a12_harness
      PPT_SKILL_RUNNER_BASE_URL: http://ppt-skill-runner:8090
      PPT_HARNESS_GENERATION_SOURCE: ${PPT_HARNESS_GENERATION_SOURCE:-FIXTURE}
      KIMI_API_BASE_URL: ${KIMI_API_BASE_URL:-https://api.moonshot.ai/v1}
      KIMI_MODEL: ${KIMI_MODEL:-kimi-k2.6}
      KIMI_TIMEOUT_MS: ${KIMI_TIMEOUT_MS:-120000}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      PPT_HARNESS_VISUAL_REVIEW_ENABLED: "false"
      PPT_HARNESS_ARTIFACT_ROOT: /app/data/artifacts
    ports:
      - "${PPT_HARNESS_PORT:-18091}:8091"
    volumes:
      - ppt-harness-artifacts:/app/data/artifacts
    networks:
      - a12-local-net
    depends_on:
      ppt-harness-postgres:
        condition: service_healthy
      ppt-skill-runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
    networks:
      - a12-local-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  reverse-proxy:
    build:
      context: ./infra/reverse-proxy
      dockerfile: Dockerfile
    depends_on:
      backend-api:
        condition: service_healthy
      frontend-web:
        condition: service_healthy
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8081}:80"
    networks:
      - a12-local-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  monitor-log:
    image: amir20/dozzle:v10.6.9
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MONITOR_PORT:-8082}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - a12-local-net

networks:
  a12-local-net:
    driver: bridge

volumes:
  backend-data:
  ppt-skill-results:
  ppt-harness-postgres:
  ppt-harness-artifacts:
