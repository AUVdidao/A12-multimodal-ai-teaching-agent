server:
  port: 8080

spring:
  application:
    name: a12-teaching-agent-backend
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 205MB
  datasource:
    url: jdbc:h2:file:./data/a12-teaching-agent
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO

app:
  storage:
    upload-dir: ${APP_UPLOAD_DIR:./data/uploads}
    max-file-size: ${APP_MAX_UPLOAD_SIZE:209715200}

a12:
  artifact-generator:
    mode: ${A12_ARTIFACT_GENERATOR_MODE:local}
    base-url: ${A12_ARTIFACT_GENERATOR_BASE_URL:http://file-generator-service:8080}
    timeout-ms: ${A12_ARTIFACT_GENERATOR_TIMEOUT_MS:15000}
  material-parser:
    mode: ${A12_MATERIAL_PARSER_MODE:local}
    base-url: ${A12_MATERIAL_PARSER_BASE_URL:http://file-parser-service:8080}
    timeout-ms: ${A12_MATERIAL_PARSER_TIMEOUT_MS:10000}
    max-request-bytes: ${A12_MATERIAL_PARSER_MAX_REQUEST_BYTES:20971520}
  security:
    enabled: ${A12_SECURITY_ENABLED:true}
    session-hours: ${A12_SESSION_HOURS:12}
    demo-seed-enabled: ${A12_DEMO_SEED_ENABLED:false}
    demo:
      leader-password: ${A12_DEMO_LEADER_PASSWORD:}
      teacher-password: ${A12_DEMO_TEACHER_PASSWORD:}
      student-password: ${A12_DEMO_STUDENT_PASSWORD:}
      multi-password: ${A12_DEMO_MULTI_PASSWORD:}
  ai:
    provider: ${A12_AI_PROVIDER:${AI_PROVIDER:MOCK}}
    fallback-to-mock: ${A12_AI_FALLBACK_TO_MOCK:true}
    dify:
      base-url: ${A12_AI_DIFY_BASE_URL:${DIFY_BASE_URL:https://api.dify.ai/v1}}
      user-prefix: ${A12_AI_DIFY_USER_PREFIX:a12-project-}
      connect-timeout: ${A12_AI_DIFY_CONNECT_TIMEOUT:5s}
      read-timeout: ${A12_AI_DIFY_READ_TIMEOUT:60s}
      workflows:
        clarification:
          workflow-id: ${DIFY_WF01_WORKFLOW_ID:}
          api-key: ${DIFY_WF01_API_KEY:}
        summary:
          workflow-id: ${DIFY_WF02_WORKFLOW_ID:}
          api-key: ${DIFY_WF02_API_KEY:}
        material:
          workflow-id: ${DIFY_WF03_WORKFLOW_ID:}
          api-key: ${DIFY_WF03_API_KEY:}
        knowledge-intent:
          workflow-id: ${DIFY_WF04_WORKFLOW_ID:}
          api-key: ${DIFY_WF04_API_KEY:}
        generation-plan:
          workflow-id: ${DIFY_WF05_WORKFLOW_ID:}
          api-key: ${DIFY_WF05_API_KEY:}
        content-draft:
          workflow-id: ${DIFY_WF06_WORKFLOW_ID:}
          api-key: ${DIFY_WF06_API_KEY:}
        revision:
          workflow-id: ${DIFY_WF07_WORKFLOW_ID:}
          api-key: ${DIFY_WF07_API_KEY:}
