services:
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      DIFY_BASE_URL: ${DIFY_BASE_URL:-}
      A12_AI_PROVIDER: ${AI_PROVIDER:-mock}
      A12_AI_FALLBACK_TO_MOCK: "true"
      A12_AI_DIFY_BASE_URL: ${DIFY_BASE_URL:-https://api.dify.ai/v1}
      DIFY_WF01_API_KEY: ${DIFY_WF01_API_KEY:-}
      DIFY_WF02_API_KEY: ${DIFY_WF02_API_KEY:-}
      DIFY_WF03_API_KEY: ${DIFY_WF03_API_KEY:-}
      DIFY_WF04_API_KEY: ${DIFY_WF04_API_KEY:-}
      DIFY_WF05_API_KEY: ${DIFY_WF05_API_KEY:-}
      DIFY_WF06_API_KEY: ${DIFY_WF06_API_KEY:-}
      DIFY_WF07_API_KEY: ${DIFY_WF07_API_KEY:-}
      DIFY_WF01_WORKFLOW_ID: ${DIFY_WF01_WORKFLOW_ID:-}
      DIFY_WF02_WORKFLOW_ID: ${DIFY_WF02_WORKFLOW_ID:-}
      DIFY_WF03_WORKFLOW_ID: ${DIFY_WF03_WORKFLOW_ID:-}
      DIFY_WF04_WORKFLOW_ID: ${DIFY_WF04_WORKFLOW_ID:-}
      DIFY_WF05_WORKFLOW_ID: ${DIFY_WF05_WORKFLOW_ID:-}
      DIFY_WF06_WORKFLOW_ID: ${DIFY_WF06_WORKFLOW_ID:-}
      DIFY_WF07_WORKFLOW_ID: ${DIFY_WF07_WORKFLOW_ID:-}
      APP_UPLOAD_DIR: ${APP_UPLOAD_DIR:-/app/data/uploads}
      APP_MAX_UPLOAD_SIZE: ${APP_MAX_UPLOAD_SIZE:-209715200}
      A12_SECURITY_ENABLED: ${A12_SECURITY_ENABLED:-true}
      A12_SESSION_HOURS: ${A12_SESSION_HOURS:-12}
      A12_DEMO_SEED_ENABLED: ${A12_DEMO_SEED_ENABLED:-true}
      A12_DEMO_LEADER_PASSWORD: ${A12_DEMO_LEADER_PASSWORD:-Leader123!}
      A12_DEMO_TEACHER_PASSWORD: ${A12_DEMO_TEACHER_PASSWORD:-Teacher123!}
      A12_DEMO_STUDENT_PASSWORD: ${A12_DEMO_STUDENT_PASSWORD:-Student123!}
      A12_DEMO_MULTI_PASSWORD: ${A12_DEMO_MULTI_PASSWORD:-Multi123!}
      A12_MATERIAL_PARSER_MODE: ${A12_MATERIAL_PARSER_MODE:-remote}
      A12_MATERIAL_PARSER_BASE_URL: ${A12_MATERIAL_PARSER_BASE_URL:-http://file-parser-service:8080}
      A12_MATERIAL_PARSER_TIMEOUT_MS: ${A12_MATERIAL_PARSER_TIMEOUT_MS:-10000}
      A12_ARTIFACT_GENERATOR_MODE: ${A12_ARTIFACT_GENERATOR_MODE:-remote}
      A12_ARTIFACT_GENERATOR_BASE_URL: ${A12_ARTIFACT_GENERATOR_BASE_URL:-http://file-generator-service:8080}
      A12_ARTIFACT_GENERATOR_TIMEOUT_MS: ${A12_ARTIFACT_GENERATOR_TIMEOUT_MS:-15000}
    volumes:
      - backend-data:/app/data
    networks:
      - a12-local-net
    depends_on:
      file-parser-service:
        condition: service_healthy
      file-generator-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  file-parser-service:
    build:
      context: ./file-parser-service
      dockerfile: Dockerfile
    networks:
      - a12-local-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/internal/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  file-generator-service:
    build:
      context: ./file-generator-service
      dockerfile: Dockerfile
    networks:
      - a12-local-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/internal/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
    networks:
      - a12-local-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  reverse-proxy:
    build:
      context: ./infra/reverse-proxy
      dockerfile: Dockerfile
    depends_on:
      backend-api:
        condition: service_healthy
      frontend-web:
        condition: service_healthy
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8081}:80"
    networks:
      - a12-local-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  monitor-log:
    image: amir20/dozzle:v10.6.9
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MONITOR_PORT:-8082}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - a12-local-net

networks:
  a12-local-net:
    driver: bridge

volumes:
  backend-data:
